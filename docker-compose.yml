services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: dragonfly
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/dragonfly:/data
    command:
      - "--memcached_port=0"
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  emotionai-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: emotionai-server:latest
    container_name: emotionai-server
    network_mode: host
    volumes:
      - ./logs:/emotionai/logs
      - ./uploads:/emotionai/uploads
      - ./results:/emotionai/results
      - ./frontend/build:/emotionai/frontend
      - ./config.yaml:/emotionai/config.yaml
      - ./build/emotionai:/emotionai/emotionai
    environment:
      - LOG_LEVEL=info
      - DRAGONFLY_HOST=127.0.0.1
      - DRAGONFLY_PORT=6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=80
    depends_on:
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

volumes:
  prometheus_data:
  grafana_data:
  dragonfly_data:

networks:
  monitoring:
    driver: bridge