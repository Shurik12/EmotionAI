services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: dragonfly
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/dragonfly:/data
    command:
      - "--memcached_port=0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  emotionai-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: emotionai-server:latest
    container_name: emotionai-server
    network_mode: host
    volumes:
      # Binary and dependencies
      - ./build/emotionai:/emotionai/emotionai
      # Configuration
      - ./config.yaml:/emotionai/config.yaml
      # Data directories
      - ./logs:/emotionai/logs
      - ./uploads:/emotionai/uploads
      - ./results:/emotionai/results
      - ./storage:/emotionai/storage
      # Models
      - ./models:/emotionai/models
      # Frontend
      - ./frontend/build:/emotionai/frontend
      # Custom libraries if needed (optional)
      # - ./contrib:/emotionai/contrib
    environment:
      - CONFIG_FILE=/emotionai/config.yaml
    depends_on:
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped