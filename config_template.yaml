server:
  host: "0.0.0.0"
  port: 8080
  
paths:
  upload: "./uploads"
  results: "./results"
  logs: "./logs"
  frontend: "./frontend"

app:
  max_content_length: 52428800  # 50MB in bytes
  allowed_extensions: ["png", "jpg", "jpeg", "mp4", "avi", "webm", "mp3", "wav"]
  task_expiration: 3600  # 1 hour in seconds
  application_expiration: 2592000  # 30 days in seconds

logging:
  level: "info"  # trace, debug, info, warn, error, critical
  max_file_size: 20971520  # 20MB in bytes
  max_files: 5
  console_enabled: true
  file_enabled: true
  pattern: "[%Y-%m-%d %H:%M:%S.%e] [%^%l%$] [%n] %v"  # Console pattern with colors
  file_pattern: "[%Y-%m-%d %H:%M:%S.%e] [%l] [%n] %v"  # File pattern without colors
  flush_on_level: "info"  # Level at which to flush immediately

cluster:
  enabled: false

queue:
  batch_queue_name: "tasks:batch"
  realtime_queue_name: "tasks:realtime"
  visibility_timeout: 300  # 5 minutes - task invisible to others during processing
  max_retries: 3          # maximum retries for failed tasks
  batch_size: 50          # number of tasks to process in batch operations
  poll_interval_ms: 100   # milliseconds between queue polls

# Enhanced task management for distributed environment
task_management:
  cache_ttl: 300          # 5 minutes in seconds
  max_cache_size: 10000
  batch_size: 50
  batch_timeout_ms: 100

dragonfly:
  host: "127.0.0.1"
  port: 6379
  db: 0
  password: ""
  pool_size: 100
  pipeline_enabled: true

storage:
  type: "local"
  base_path: "storage"

mtcnn:
  keep_all: false
  post_process: false
  min_face_size: 40
  device: "cpu"

model:
  backend: "torch"
  emotion_model_path: "models/enet_b0_8_va_mtl.pt" # enet_b2_7.pt
  audio_model_path: "models/audio_model.pt"
  face_detection_models_path: "models/"

# Video processing: extract frames at a fixed time interval
video:
  frame_interval_seconds: 5.0  # extract one frame every N seconds
  pool_size: 4                 # parallel model instances for multi-frame processing

# AI Configuration (OpenAI-compatible provider, used for the Razuma Focus
# task breakdown). The client posts to {base_url}/chat/completions with
# "Authorization: Bearer <api_key>". Only the task text and the block
# duration are sent — never camera frames.
ai:
  enabled: false # Set to true to enable
  base_url: "https://shared1.multitool.works:4000/v1"
  model: "deepseek-v4-flash"
  api_key: ""
  verify_ssl: true
  timeout_seconds: 30

# Audio burnout analysis. Every key is optional; values below are the
# built-in defaults, calibrated on the current benchmark/control set with
# tests/benchmark/BurnoutBenchmark.cpp. The default baseline was previously a
# fabricated profile (happy=0.30, pause_ratio=0.10, ...) that real recordings
# never matched, and the acoustic values were later found to sit 1.3-2.2x
# above the control medians, so prosodic_flattening/pause_tempo saturated on
# normal speech.
#
# window_seconds/max_windows: a recording is split into up to max_windows
#   windows of window_seconds, evenly spaced across the whole file. Per-window
#   outputs are aggregated with `aggregation` ("median" or "mean").
# min_valid_windows: fewer usable (speech-bearing) windows than this yields
#   INSUFFICIENT_DATA.
# min_voice_activity_ratio: windows with less voiced audio than this return
#   INSUFFICIENT_DATA instead of a score (WavLM is near-uniform on non-speech).
# base_*: population-median fallback used only when no per-user baseline was
#   stored. Prefer a real per-user baseline when available.
burnout:
  window_seconds: 10.0
  max_windows: 5
  min_valid_windows: 1
  aggregation: "median"
  min_voice_activity_ratio: 0.15
  base_pitch_variation: 0.1025
  base_pitch_range: 77.05
  base_intensity_variation: 1.4243
  base_pause_ratio: 0.3855
  base_pause_mean_duration: 0.1672
  base_pause_max_duration: 1.15
  base_speech_rate: 4.304
  base_neutral: 0.1665
  base_happy: 0.1209
  base_sad: 0.1124
  base_angry: 0.1274
  base_fear: 0.1574
  base_disgust: 0.1716
