server:
  host: "127.0.0.1"
  port: 8085

paths:
  upload: "/tmp/test_rate_limit_upload"
  results: "/tmp/test_rate_limit_results"
  logs: "/tmp/test_rate_limit_logs"
  frontend: "/tmp/test_rate_limit_static"

app:
  max_content_length: 10485760
  allowed_extensions: ["png", "jpg", "jpeg", "mp4", "avi", "webm", "mp3"]
  task_expiration: 1800
  application_expiration: 604800
  emotion_categories: ["anger", "disgust", "fear", "happiness", "neutral", "sadness", "surprise"]

logging:
  level: "error"
  max_file_size: 10485760
  max_files: 5
  console_enabled: true
  file_enabled: true
  pattern: "[%Y-%m-%d %H:%M:%S.%e] [%^%l%$] [%n] %v"
  file_pattern: "[%Y-%m-%d %H:%M:%S.%e] [%l] [%n] %v"
  flush_on_level: "error"

redis:
  host: "localhost"
  port: 6379
  db: 4
  password: "redis_password"

dragonfly:
  host: "127.0.0.1"
  port: 6379
  db: 4
  password: ""

storage:
  type: "local"
  base_path: "/tmp/test_rate_limit_storage"

mtcnn:
  keep_all: true
  post_process: true
  min_face_size: 40
  device: "cpu"

model:
  backend: "torch"
  emotion_model_path: "models/enet_b0_8_va_mtl.pt"
  face_detection_models_path: "models/"

# One request per client; used to assert 429 + Retry-After and per-client buckets.
security:
  api_token: ""
  rate_limit_enabled: true
  rate_limit_per_minute: 1
  rate_limit_burst: 1
  rate_limit_max_keys: 100
  trust_proxy_headers: true
  trusted_proxies: ["127.0.0.0/8"]
  device_auth_enabled: false
